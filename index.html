<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denzven Vadakkan | Process Engineer, Developer & Classical Artist</title>
    
    <meta name="description" content="Portfolio of Denzven Ignatius Vadakkan: Synthesizing Chemical Engineering, Full-Stack Software Development, and Somatic Arts (Karate & Bharatanatyam)." />
    <meta name="keywords" content="Chemical Engineering, Python, Flask API, React, Lazer Showdown, Bharatanatyam, Shito-Ryu Karate, Spyboy contributor, Bharati Vidyapeeth, Process Optimization" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <style>
      /* Preloader Styles */
      #preloader {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #0a0a1a;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999;
        font-family: 'League Spartan', sans-serif;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      .hex-loader {
        width: 60px;
        height: 100px;
        position: relative;
        animation: hex-spin 2s infinite ease-in-out;
      }
      .hex-loader::before, .hex-loader::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-left: 2px solid var(--accent-gold, #f3d250);
        border-right: 2px solid var(--accent-lilac, #d8b4e2);
        border-radius: 4px;
      }
      .hex-loader::before {
        transform: rotate(60deg);
      }
      .hex-loader::after {
        transform: rotate(-60deg);
      }
      .preloader-text {
        margin-top: 2rem;
        color: #d8b4e2;
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: pulse-text 1.5s infinite;
      }
      @keyframes hex-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-text {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
    <div id="preloader">
      <div class="hex-loader"></div>
      <div class="preloader-text">Loading...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denzven Vadakkan | Process Engineer, Developer & Classical Artist</title>
    
    <meta name="description" content="Portfolio of Denzven Ignatius Vadakkan: Synthesizing Chemical Engineering, Full-Stack Software Development, and Somatic Arts (Karate & Bharatanatyam)." />
    <meta name="keywords" content="Chemical Engineering, Python, Flask API, React, Lazer Showdown, Bharatanatyam, Shito-Ryu Karate, Spyboy contributor, Bharati Vidyapeeth, Process Optimization" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        /* Preloader Styles */
        #preloader {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: #000000;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          z-index: 9999;
          font-family: 'League Spartan', sans-serif;
        }
        .skeleton-orb {
          width: 80px; height: 80px;
          border-radius: 50%;
          background: linear-gradient(90deg, rgba(74,222,128,0.2) 25%, rgba(74,222,128,0.5) 50%, rgba(74,222,128,0.2) 75%);
          background-size: 200% 100%;
          animation: skeleton-load 1.5s infinite;
          margin-bottom: 2rem;
          box-shadow: 0 0 20px rgba(74,222,128,0.3);
        }
        .skeleton-text {
          width: 200px; height: 24px;
          border-radius: 12px;
          background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
          background-size: 200% 100%;
          animation: skeleton-load 1.5s infinite;
        }
        @keyframes skeleton-load {
          0% { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }
      </style>
      <div id="preloader">
        <div class="skeleton-orb"></div>
        <div class="skeleton-text"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
